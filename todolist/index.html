<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Drag and Drop TodoList</title>
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.0/normalize.css'> -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- partial:index.partial.html -->
<header>
  <!-- <h1>Drag & Drop<br/><span>Lean Kanban Board</span></h1> -->
</header>

<div class="add-task-container">
  <input type="text" maxlength="100" id="taskText" placeholder="Input New Task..." onkeydown="if (event.keyCode == 13)
                        document.getElementById('add').click()">
  <button id="add" class="button add-button" onclick="addTask()">Add</button>
  <button id="add" class="button add-button" onclick="DeleteAllTask()">Clear</button>
</div>

<div class="main-container">
  <ul class="columns">

    <li class="column to-do-column">
      <div class="column-header">
        <h4>待办</h4>
      </div>
      <ul class="task-list" id="to-do">
        
      </ul>
      <div class="column-button">
        <button class="button delete-button" onclick="emptyTodo()">Delete</button>
      </div>
    </li>

    <li class="column doing-column">
      <div class="column-header">
        <h4>进行</h4>
      </div>
      <ul class="task-list" id="doing">
        
      </ul>
      <div class="column-button">
        <button class="button delete-button" onclick="emptyDoing()">Delete</button>
      </div>
    </li>

    <li class="column done-column">
      <div class="column-header">
        <h4>完成</h4>
      </div>
      <ul class="task-list" id="done">
        
      </ul>
      <div class="column-button">
        <button class="button delete-button" onclick="emptyDone()">Delete</button>
      </div>
    </li>

    <li class="column trash-column">
      <div class="column-header">
        <h4>销毁</h4>
      </div>
      <ul class="task-list" id="trash">
        
      </ul>
      <div class="column-button">
        <button class="button delete-button" onclick="emptyTrash()">Delete</button>
      </div>
    </li>

  </ul>
</div>

<footer>
  <!-- <p>Built with <a href="https://github.com/bevacqua/dragula" target="_blank">Dragula</a> and Vanilla JS by <a href="http://nikkipantony.com" target="_blank">Nikki Pantony</a></p> -->
</footer>
<!-- partial -->
  <script src='./dragula.js'></script>
  <script  src="./script.js"></script>

</body>
</html>
